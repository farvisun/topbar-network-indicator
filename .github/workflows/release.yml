name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for example v6.0)
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install GJS and GNOME extension tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-dev-bin gir1.2-soup-3.0 gnome-shell zip
      - name: Check the tag matches metadata.json
        run: |
          version=$(python3 -c "import json; print(json.load(open('metadata.json'))['version-name'])")
          test "$RELEASE_TAG" = "v$version" || { echo "Tag $RELEASE_TAG does not match version-name $version"; exit 1; }
      - name: Compile settings schema (strict)
        run: glib-compile-schemas --strict schemas
      - name: Test
        env:
          GSETTINGS_BACKEND: memory
        run: for t in network chart apps connections history connectionMonitor; do gjs -m "tests/$t.js"; done
      - name: Build
        run: |
          sh build.sh
          cd dist && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --verify-tag \
              --title "Topbar Network ${RELEASE_TAG#v}" --generate-notes --latest
          fi
